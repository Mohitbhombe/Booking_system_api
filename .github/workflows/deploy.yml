name: Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          NODE_ENV: test
        run: npm test --silent

      - name: Trigger Render deployment
        if: secrets.RENDER_API_KEY && secrets.RENDER_SERVICE_ID
        run: |
          echo "Triggering Render deploy for service $RENDER_SERVICE_ID"
          curl -X POST "https://api.render.com/deploys" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"serviceId":"'$RENDER_SERVICE_ID'"}'

      - name: Fail if Render secrets are not configured
        if: !secrets.RENDER_API_KEY || !secrets.RENDER_SERVICE_ID
        run: |
          echo "Render API deployment skipped because secrets are missing."
          echo "Set RENDER_API_KEY and RENDER_SERVICE_ID in GitHub repository secrets to enable auto-deploy."
          exit 1
